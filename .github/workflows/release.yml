name: Release

on:
  push:
    tags:
      - "v*"

# 构建与冒烟只读；发布 job 单独提升 contents 写权限。
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build release package
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      source_commit: ${{ steps.metadata.outputs.source_commit }}
      archive_name: ${{ steps.metadata.outputs.archive_name }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          FORCED_PUSH: ${{ github.event.forced }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:REF_TYPE -ne "tag") {
            throw "release workflow requires a tag ref"
          }
          if ($env:FORCED_PUSH -ieq "true") {
            throw "forced tag updates cannot create a release"
          }
          $tagBytes = [Text.Encoding]::UTF8.GetByteCount($env:RELEASE_TAG)
          if ($tagBytes -lt 2 -or $tagBytes -gt 128 -or $env:RELEASE_TAG -cnotmatch '^v[A-Za-z0-9._-]+$') {
            throw "release tag is not a valid runtime version"
          }
          if ($env:RELEASE_TAG.Contains("..") -or
              $env:RELEASE_TAG.Contains("@{") -or
              $env:RELEASE_TAG.EndsWith(".") -or
              $env:RELEASE_TAG.EndsWith(".lock")) {
            throw "release tag contains a forbidden git ref pattern"
          }
          $sourceCommit = (& git rev-parse --verify "HEAD^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceCommit -cnotmatch '^[0-9a-f]{40}$') {
            throw "checked out source is not a full commit id"
          }

          $isPrerelease = $env:RELEASE_TAG -imatch '-(?:beta|rc|alpha)'
          $buildDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $archiveName = "auto-mas-runtime-$($env:RELEASE_TAG)-windows-x64.zip"

          @(
            "tag=$($env:RELEASE_TAG)"
            "source_commit=$sourceCommit"
            "archive_name=$archiveName"
            "prerelease=$($isPrerelease.ToString().ToLowerInvariant())"
            "build_date=$buildDate"
          ) | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8NoBOM

      - name: Test
        run: |
          $ErrorActionPreference = "Stop"
          & go test ./...
          if ($LASTEXITCODE -ne 0) {
            throw "release tests failed"
          }

      - name: Build Windows x64 executable
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          BUILD_DATE: ${{ steps.metadata.outputs.build_date }}
          SOURCE_COMMIT: ${{ steps.metadata.outputs.source_commit }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $binary = Join-Path $dist "auto-mas-runtime.exe"
          $ldflags = "-s -w -X github.com/AUTO-MAS-Project/AUTO-MAS-Runtime/internal/version.Version=$($env:RELEASE_TAG) -X github.com/AUTO-MAS-Project/AUTO-MAS-Runtime/internal/version.Commit=$($env:SOURCE_COMMIT) -X github.com/AUTO-MAS-Project/AUTO-MAS-Runtime/internal/version.BuildDate=$($env:BUILD_DATE)"
          & go build -trimpath -buildvcs=false -ldflags $ldflags -o $binary ./cmd/auto-mas-runtime
          if ($LASTEXITCODE -ne 0) {
            throw "Windows x64 build failed"
          }
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Windows x64 build did not produce auto-mas-runtime.exe"
          }

      - name: Assemble archive and checksums
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          ARCHIVE_NAME: ${{ steps.metadata.outputs.archive_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          $package = Join-Path $dist "package"
          $binary = Join-Path $dist "auto-mas-runtime.exe"
          $license = Join-Path $env:GITHUB_WORKSPACE "LICENSE"
          if (-not (Test-Path -LiteralPath $license -PathType Leaf)) {
            throw "LICENSE is required for release packaging; add the approved repository license before tagging a release"
          }

          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item -LiteralPath $binary -Destination (Join-Path $package "auto-mas-runtime.exe") -Force
          Copy-Item -LiteralPath $license -Destination (Join-Path $package "LICENSE") -Force
          $readme = @'
          AUTO-MAS Runtime {0}
          Windows x64 release artifact.

          Run auto-mas-runtime.exe version to inspect the build.
          Run auto-mas-runtime.exe doctor --output ndjson for a machine-readable diagnostic.

          Source: https://github.com/AUTO-MAS-Project/AUTO-MAS-Runtime
          '@ -f $env:RELEASE_TAG
          $readme | Set-Content -LiteralPath (Join-Path $package "README.md") -Encoding utf8NoBOM

          $archive = Join-Path $dist $env:ARCHIVE_NAME
          Push-Location -LiteralPath $package
          try {
            Compress-Archive -Path @("auto-mas-runtime.exe", "LICENSE", "README.md") -DestinationPath $archive -CompressionLevel Optimal -Force
          }
          finally {
            Pop-Location
          }
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "release archive was not created"
          }

          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($env:ARCHIVE_NAME)" | Set-Content -LiteralPath (Join-Path $dist "SHA256SUMS.txt") -Encoding ascii
          $archives = @(Get-ChildItem -LiteralPath $dist -Filter "*.zip" -File)
          if ($archives.Count -ne 1 -or $archives[0].Name -ne $env:ARCHIVE_NAME) {
            throw "release output contains an unexpected archive set"
          }

      - name: Upload release assets for publishing
        uses: actions/upload-artifact@v4
        with:
          name: runtime-release-assets
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: runtime-release-assets
          path: release-assets

      - name: Reject forced or duplicate release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.package.outputs.source_commit }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          $ErrorActionPreference = "Stop"
          $tagBytes = [Text.Encoding]::UTF8.GetByteCount($env:RELEASE_TAG)
          if ($tagBytes -lt 2 -or $tagBytes -gt 128 -or
              $env:RELEASE_TAG -cnotmatch '^v[A-Za-z0-9._-]+$' -or
              $env:RELEASE_TAG.Contains("..") -or
              $env:RELEASE_TAG.Contains("@{") -or
              $env:RELEASE_TAG.EndsWith(".") -or
              $env:RELEASE_TAG.EndsWith(".lock")) {
            throw "release tag failed the immutable release safety check"
          }
          if ($env:SOURCE_COMMIT -cnotmatch '^[0-9a-f]{40}$') {
            throw "source commit failed the immutable release safety check"
          }
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN) -or
              [string]::IsNullOrWhiteSpace($env:API_URL) -or
              [string]::IsNullOrWhiteSpace($env:REPOSITORY)) {
            throw "GitHub release API context is incomplete"
          }
          $tagPath = [Uri]::EscapeDataString($env:RELEASE_TAG)
          $uri = "$($env:API_URL.TrimEnd('/'))/repos/$($env:REPOSITORY)/releases/tags/$tagPath"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $($env:GH_TOKEN)"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $tagURI = "$($env:API_URL.TrimEnd('/'))/repos/$($env:REPOSITORY)/git/ref/tags/$tagPath"
          $tagResponse = Invoke-WebRequest -Uri $tagURI -Headers $headers -Method Get -SkipHttpErrorCheck
          if ($tagResponse.StatusCode -ne 200) {
            throw "unable to resolve release tag $($env:RELEASE_TAG) (HTTP $($tagResponse.StatusCode))"
          }
          $tagReference = $tagResponse.Content | ConvertFrom-Json -ErrorAction Stop
          $objectType = [string]$tagReference.object.type
          $objectSHA = [string]$tagReference.object.sha
          $resolvedCommit = ""
          $seenObjects = @{}
          for ($depth = 0; $depth -lt 8; $depth++) {
            if ($objectSHA -cnotmatch '^[0-9a-f]{40}$') {
              throw "release tag object contains an invalid sha"
            }
            switch ($objectType) {
              "commit" {
                $resolvedCommit = $objectSHA
              }
              "tag" {
                if ($seenObjects.ContainsKey($objectSHA)) {
                  throw "release tag object graph contains a cycle"
                }
                $seenObjects[$objectSHA] = $true
                $objectURI = "$($env:API_URL.TrimEnd('/'))/repos/$($env:REPOSITORY)/git/tags/$objectSHA"
                $objectResponse = Invoke-WebRequest -Uri $objectURI -Headers $headers -Method Get -SkipHttpErrorCheck
                if ($objectResponse.StatusCode -ne 200) {
                  throw "unable to resolve annotated release tag object (HTTP $($objectResponse.StatusCode))"
                }
                $tagObject = $objectResponse.Content | ConvertFrom-Json -ErrorAction Stop
                $objectType = [string]$tagObject.object.type
                $objectSHA = [string]$tagObject.object.sha
              }
              default {
                throw "release tag resolves to unsupported object type $objectType"
              }
            }
            if ($resolvedCommit) {
              break
            }
          }
          if (-not $resolvedCommit) {
            throw "annotated release tag nesting exceeds the supported depth"
          }
          if ($resolvedCommit -cne $env:SOURCE_COMMIT) {
            throw "release tag moved after the workflow started"
          }

          $releaseResponse = Invoke-WebRequest -Uri $uri -Headers $headers -Method Get -SkipHttpErrorCheck
          if ($releaseResponse.StatusCode -eq 200) {
            throw "release $($env:RELEASE_TAG) already exists; refusing to overwrite it"
          }
          if ($releaseResponse.StatusCode -ne 404) {
            throw "unable to prove release $($env:RELEASE_TAG) is absent (HTTP $($releaseResponse.StatusCode))"
          }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.package.outputs.tag }}
          name: AUTO-MAS Runtime ${{ needs.package.outputs.tag }}
          files: |
            release-assets/*.zip
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
          prerelease: ${{ needs.package.outputs.prerelease }}
          generate_release_notes: true
          body: |
            Windows x64 build. The executable is intentionally unsigned per the release policy.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    name: Smoke test published release
    needs:
      - package
      - publish
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Download published archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          ARCHIVE_NAME: ${{ needs.package.outputs.archive_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          $downloadDir = Join-Path $env:RUNNER_TEMP "runtime-release-download"
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
          & gh release download $env:RELEASE_TAG --repo $env:REPOSITORY --pattern $env:ARCHIVE_NAME --dir $downloadDir --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "unable to download published release archive"
          }
          $archives = @(Get-ChildItem -LiteralPath $downloadDir -Filter "*.zip" -File)
          if ($archives.Count -ne 1 -or $archives[0].Name -ne $env:ARCHIVE_NAME) {
            throw "published release archive set is unexpected"
          }
          "ARCHIVE_PATH=$($archives[0].FullName)" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8NoBOM

      - name: Extract archive
        run: |
          $ErrorActionPreference = "Stop"
          $extractDir = Join-Path $env:RUNNER_TEMP "runtime-release-extracted"
          New-Item -ItemType Directory -Path $extractDir -Force | Out-Null
          Expand-Archive -LiteralPath $env:ARCHIVE_PATH -DestinationPath $extractDir -Force
          foreach ($required in @("auto-mas-runtime.exe", "LICENSE", "README.md")) {
            if (-not (Test-Path -LiteralPath (Join-Path $extractDir $required) -PathType Leaf)) {
              throw "release archive is missing $required"
            }
          }
          "EXTRACT_DIR=$extractDir" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8NoBOM

      - name: Run version command
        env:
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $binary = Join-Path $env:EXTRACT_DIR "auto-mas-runtime.exe"
          $stdout = Join-Path $env:RUNNER_TEMP "runtime-version.stdout"
          $stderr = Join-Path $env:RUNNER_TEMP "runtime-version.stderr"
          & $binary version --output ndjson 1> $stdout 2> $stderr
          if ($LASTEXITCODE -ne 0) {
            $diagnostic = Get-Content -LiteralPath $stderr -Raw -ErrorAction SilentlyContinue
            throw "version command failed: $diagnostic"
          }
          $events = @(
            foreach ($line in (Get-Content -LiteralPath $stdout -Encoding utf8)) {
              if ([string]::IsNullOrWhiteSpace($line)) {
                throw "version emitted an empty NDJSON line"
              }
              $document = $null
              $rootKind = $null
              try {
                $document = [System.Text.Json.JsonDocument]::Parse($line)
                $rootKind = $document.RootElement.ValueKind
              }
              catch {
                throw "version emitted a non-strict JSON line: $line"
              }
              finally {
                if ($null -ne $document) {
                  $document.Dispose()
                }
              }
              if ($rootKind -ne [System.Text.Json.JsonValueKind]::Object) {
                throw "version emitted a JSON value that is not an object"
              }
              $event = $null
              try {
                $event = $line | ConvertFrom-Json -ErrorAction Stop -NoEnumerate
              }
              catch {
                throw "version emitted a non-JSON line: $line"
              }
              if ($null -eq $event -or
                  $event.GetType() -ne [System.Management.Automation.PSCustomObject]) {
                throw "version emitted a JSON value that is not an object"
              }
              $event
            }
          )
          if ($events.Count -lt 2 -or $events[0].type -ne "hello") {
            throw "version did not start with a hello event"
          }
          $results = @($events | Where-Object { $_.type -eq "result" })
          if ($results.Count -ne 1 -or $events[-1].type -ne "result") {
            throw "version did not emit exactly one final result event"
          }
          if ($results[0].success -ne $true) {
            throw "version smoke result was not successful"
          }
          if ($events[0].runtimeVersion -ne $env:RELEASE_TAG) {
            throw "version hello runtimeVersion does not match the release tag"
          }

      - name: Run NDJSON doctor command
        run: |
          $ErrorActionPreference = "Stop"
          $binary = Join-Path $env:EXTRACT_DIR "auto-mas-runtime.exe"
          $smokeRoot = Join-Path $env:RUNNER_TEMP "runtime-smoke-root"
          New-Item -ItemType Directory -Path $smokeRoot -Force | Out-Null
          $stdout = Join-Path $env:RUNNER_TEMP "runtime-doctor.stdout"
          $stderr = Join-Path $env:RUNNER_TEMP "runtime-doctor.stderr"
          & $binary doctor --output ndjson --app-root $smokeRoot 1> $stdout 2> $stderr
          if ($LASTEXITCODE -ne 0) {
            $diagnostic = Get-Content -LiteralPath $stderr -Raw -ErrorAction SilentlyContinue
            throw "doctor command failed: $diagnostic"
          }

          $events = @(
            foreach ($line in (Get-Content -LiteralPath $stdout -Encoding utf8)) {
              if ([string]::IsNullOrWhiteSpace($line)) {
                throw "doctor emitted an empty NDJSON line"
              }
              $document = $null
              $rootKind = $null
              try {
                $document = [System.Text.Json.JsonDocument]::Parse($line)
                $rootKind = $document.RootElement.ValueKind
              }
              catch {
                throw "doctor emitted a non-strict JSON line: $line"
              }
              finally {
                if ($null -ne $document) {
                  $document.Dispose()
                }
              }
              if ($rootKind -ne [System.Text.Json.JsonValueKind]::Object) {
                throw "doctor emitted a JSON value that is not an object"
              }
              $event = $null
              try {
                $event = $line | ConvertFrom-Json -ErrorAction Stop -NoEnumerate
              }
              catch {
                throw "doctor emitted a non-JSON line: $line"
              }
              if ($null -eq $event -or
                  $event.GetType() -ne [System.Management.Automation.PSCustomObject]) {
                throw "doctor emitted a JSON value that is not an object"
              }
              $event
            }
          )
          if ($events.Count -lt 2) {
            throw "doctor emitted too few protocol events"
          }
          if ($events[0].type -ne "hello") {
            throw "doctor did not start with a hello event"
          }
          $results = @($events | Where-Object { $_.type -eq "result" })
          if ($results.Count -ne 1 -or $events[-1].type -ne "result") {
            throw "doctor did not emit exactly one final result event"
          }
          if ($results[0].success -ne $true) {
            throw "doctor smoke result was not successful"
          }
