name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          $goFiles = Get-ChildItem -LiteralPath . -Recurse -Filter "*.go" -File
          $formatDiff = gofmt -d $goFiles.FullName
          if ($formatDiff) {
            $formatDiff
            throw "Go files are not formatted"
          }

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
