name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.11"
          cache: true

      - name: Check formatting
        run: |
          $goFiles = @(git ls-files '*.go')
          if ($LASTEXITCODE -ne 0) { throw "git ls-files failed" }
          if ($goFiles.Count -eq 0) { throw "no Go files found" }
          & gofmt -w $goFiles
          if ($LASTEXITCODE -ne 0) { throw "gofmt failed" }
          & git diff --exit-code -- '*.go'
          if ($LASTEXITCODE -ne 0) { throw "Go files are not formatted" }

      - name: Vet
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw "vet failed" }

      - name: Build
        run: |
          go build -buildvcs=false ./...
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Test
        run: |
          go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }

      - name: Check reachable vulnerabilities
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          if ($LASTEXITCODE -ne 0) { throw "vulnerability check failed" }

  verify-posix:
    name: Verify ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
            uv_asset: uv-x86_64-unknown-linux-gnu.tar.gz
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            uv_asset: uv-aarch64-unknown-linux-gnu.tar.gz
          - runner: macos-15-intel
            os: darwin
            arch: amd64
            uv_asset: uv-x86_64-apple-darwin.tar.gz
          - runner: macos-15
            os: darwin
            arch: arm64
            uv_asset: uv-aarch64-apple-darwin.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
      - name: Verify native architecture
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(go env GOOS)" = "$EXPECTED_OS"
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          case "$(uname -m)/$EXPECTED_ARCH" in
            x86_64/amd64|aarch64/arm64|arm64/arm64) ;;
            *) exit 1 ;;
          esac
      - name: Download official uv verification fixture
        env:
          UV_ASSET: ${{ matrix.uv_asset }}
        run: |
          set -euo pipefail
          curl --fail --location "https://github.com/astral-sh/uv/releases/download/0.12.3/$UV_ASSET" --output "$RUNNER_TEMP/$UV_ASSET"
      - name: Verify formatting, vet, build, tests, race and repeated concurrency tests
        env:
          AUTO_MAS_UV_INTEGRATION_ARCHIVE: ${{ runner.temp }}/${{ matrix.uv_asset }}
        run: bash scripts/verify-posix.sh
