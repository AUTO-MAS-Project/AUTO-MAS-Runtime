name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: true

      - name: Check formatting
        run: |
          $goFiles = Get-ChildItem -LiteralPath . -Recurse -Filter "*.go" -File
          $formatDiff = gofmt -d $goFiles.FullName
          if ($LASTEXITCODE -ne 0) { throw "gofmt failed" }
          if ($formatDiff) {
            $formatDiff
            throw "Go files are not formatted"
          }

      - name: Vet
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw "vet failed" }

      - name: Build
        run: |
          go build -buildvcs=false ./...
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Test
        run: |
          go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }

      - name: Check reachable vulnerabilities
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          if ($LASTEXITCODE -ne 0) { throw "vulnerability check failed" }
